<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>minami Timesick Traveler 2027 Fan Guide</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101014;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 55px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #190b16, #35111d);
    }

    header h1 {
      margin: 0 0 12px;
      color: #ff5477;
      font-size: 32px;
    }

    header h2 {
      margin: 0;
      color: #eeeeee;
      font-size: 20px;
      font-weight: normal;
    }

    header p {
      margin: 20px 0 0;
      color: #bbbbbb;
      font-size: 14px;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 35px auto;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 22px;
    }

    .song-list {
      display: grid;
      gap: 12px;
    }

    .song-button {
      width: 100%;
      padding: 18px 20px;
      border: 1px solid #3a3a45;
      border-radius: 14px;
      background: #1b1b23;
      color: #ffffff;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .song-button:hover {
      background: #30202a;
      border-color: #ff5477;
      transform: translateY(-2px);
    }

    .song-number {
      display: inline-block;
      width: 32px;
      color: #ff5477;
      font-weight: bold;
    }

    #detail {
      display: none;
    }

    .back-button {
      margin-bottom: 20px;
      padding: 10px 16px;
      border: 1px solid #555563;
      border-radius: 8px;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
    }

    .back-button:hover {
      background: #292932;
    }

    #song-title {
      margin-bottom: 20px;
      color: #ff5477;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 14px;
      background: #000000;
    }

    /* HTML5 video 태그 스타일 */
    .video-wrapper video {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      object-fit: contain;
    }

    /* 비디오 로딩 중 표시 안내 */
    .video-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888888;
      font-size: 14px;
      pointer-events: none;
    }

    .guide-box {
      margin-top: 24px;
      padding: 22px;
      border-radius: 14px;
      background: #1b1b23;
    }

    .guide-box h3 {
      margin-top: 0;
      color: #ffcf5a;
    }

    .guide-box li {
      margin-bottom: 12px;
      line-height: 1.6;
      color: #dddddd;
    }

    footer {
      padding: 30px 20px;
      color: #777783;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>美波 minami</h1>
    <h2>Timesick Traveler 2027</h2>
    <p>Unofficial Fan-made Cheering Guide</p>
  </header>

  <main>
    <section id="list">
      <h2 class="section-title">곡 목록</h2>
      <div id="song-list" class="song-list"></div>
    </section>

    <section id="detail">
      <button class="back-button" onclick="showList()">
        ← 곡 목록으로 돌아가기
      </button>

      <h2 id="song-title"></h2>

      <div class="video-wrapper">
        <span id="loading-text" class="video-loading">영상 스트림을 불러오는 중...</span>
        <!-- YouTube iframe 대신 순수 HTML5 video 태그 적용 -->
        <video id="video-player" controls playsinline autoplay></video>
      </div>

      <div class="guide-box">
        <h3>응원 및 감상 포인트</h3>
        <ul id="guide-points"></ul>
      </div>
    </section>
  </main>

  <footer>
    본 사이트는 미나미 팬이 제작한 비공식 응원 가이드입니다.
  </footer>

  <script>
    const songs = [
      {
        title: "테스트 곡 1 (Main Stream)",
        youtubeId: "dQw4w9WgXcQ",
        guidePoints: [
          "이곳에 함께 부를 구간을 적을 예정입니다.",
          "이곳에 박수나 손동작 타이밍을 적을 예정입니다.",
          "이곳에 감상 포인트를 적을 예정입니다."
        ]
      },
      {
        title: "테스트 곡 2",
        youtubeId: "dQw4w9WgXcQ",
        guidePoints: [
          "나중에 실제 응원 포인트로 바꿔주세요."
        ]
      },
      {
        title: "테스트 곡 3",
        youtubeId: "dQw4w9WgXcQ",
        guidePoints: [
          "곡 정보를 준비한 뒤 이 부분을 수정하면 됩니다."
        ]
      }
    ];

    const songList = document.getElementById("song-list");
    const listSection = document.getElementById("list");
    const detailSection = document.getElementById("detail");
    const songTitle = document.getElementById("song-title");
    const videoPlayer = document.getElementById("video-player");
    const loadingText = document.getElementById("loading-text");
    const guidePoints = document.getElementById("guide-points");

    // Invidious 퍼블릭 인스턴스 서버 주소 목록 (백업 서버 자동 전환용)
    const invidiousInstances = [
      "https://inv.nerdvpn.de",
      "https://invidious.nerdvpn.de",
      "https://vid.puffyan.us",
      "https://invidious.flokinet.to"
    ];

    songs.forEach((song, index) => {
      const button = document.createElement("button");

      button.className = "song-button";
      button.innerHTML = `
        <span class="song-number">${String(index + 1).padStart(2, "0")}</span>
        ${song.title}
      `;

      button.addEventListener("click", () => {
        showDetail(song);
      });

      songList.appendChild(button);
    });

    async function showDetail(song) {
      listSection.style.display = "none";
      detailSection.style.display = "block";

      songTitle.textContent = song.title;
      loadingText.style.display = "block";
      videoPlayer.src = ""; // 이전 영상 초기화

      guidePoints.innerHTML = "";
      song.guidePoints.forEach((point) => {
        const li = document.createElement("li");
        li.textContent = point;
        guidePoints.appendChild(li);
      });

      window.scrollTo(0, 0);

      // Invidious API를 활용하여 순수 비디오 스트림 URL 가져오기
      await loadDirectVideoStream(song.youtubeId);
    }

    async function loadDirectVideoStream(youtubeId) {
      let streamUrl = null;

      // 이용 가능한 Invidious 서버 중 동작하는 서버에서 스트림 URL을 요청
      for (const instance of invidiousInstances) {
        try {
          const response = await fetch(`${instance}/api/v1/videos/${youtubeId}`);
          if (!response.ok) continue;

          const data = await response.json();
          // 비디오와 오디오가 통합된 MP4 스트림 추출 (가장 화질이 적절한 스트림)
          const format = data.formatStreams.find(s => s.container === 'mp4' && s.quality === 'medium') 
                      || data.formatStreams[0];

          if (format && format.url) {
            streamUrl = format.url;
            break;
          }
        } catch (err) {
          console.warn(`서버 ${instance} 연결 실패, 다음 서버 시도 중...`);
        }
      }

      if (streamUrl) {
        loadingText.style.display = "none";
        videoPlayer.src = streamUrl;
        
        // 클릭 액션 이후 호출되므로 소리(Audio) 포함 자동재생
        videoPlayer.play().catch(e => console.log("자동재생 차단됨:", e));
      } else {
        loadingText.textContent = "영상을 불러올 수 없습니다. 네트워크를 확인해주세요.";
      }
    }

    function showList() {
      detailSection.style.display = "none";
      listSection.style.display = "block";

      // 목록으로 돌아갈 때 영상 일시정지 및 소스 초기화
      videoPlayer.pause();
      videoPlayer.src = "";
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
