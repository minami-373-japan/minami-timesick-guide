<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>minami Timesick Traveler 2027 Fan Guide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101014;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 55px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #190b16, #35111d);
    }

    header h1 {
      margin: 0 0 12px;
      color: #ff5477;
      font-size: 32px;
    }

    header h2 {
      margin: 0;
      color: #eeeeee;
      font-size: 20px;
      font-weight: normal;
    }

    header p {
      margin: 20px 0 0;
      color: #bbbbbb;
      font-size: 14px;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 35px auto;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 22px;
    }

    .song-list {
      display: grid;
      gap: 12px;
    }

    .song-button {
      width: 100%;
      padding: 18px 20px;
      border: 1px solid #3a3a45;
      border-radius: 14px;
      background: #1b1b23;
      color: #ffffff;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .song-button:hover {
      background: #30202a;
      border-color: #ff5477;
      transform: translateY(-2px);
    }

    .song-number {
      display: inline-block;
      width: 32px;
      color: #ff5477;
      font-weight: bold;
    }

    #detail {
      display: none;
    }

    .back-button {
      margin-bottom: 20px;
      padding: 10px 16px;
      border: 1px solid #555563;
      border-radius: 8px;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
    }

    .back-button:hover {
      background: #292932;
    }

    #song-title {
      margin-bottom: 20px;
      color: #ff5477;
    }

    /* 필수: 비디오 플레이어 화면 영역 */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 14px;
      background: #000000;
    }

    .video-wrapper iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      left: 0;
      top: 0;
    }

    .guide-box {
      margin-top: 24px;
      padding: 22px;
      border-radius: 14px;
      background: #1b1b23;
    }

    .guide-box h3 {
      margin-top: 0;
      color: #ffcf5a;
    }

    .guide-box li {
      margin-bottom: 12px;
      line-height: 1.6;
      color: #dddddd;
    }

    /* 가사지 스타일 */
    .lyrics-box {
      margin-top: 24px;
      padding: 22px;
      border-radius: 14px;
      background: #15151c;
      border: 1px solid #2a2a36;
    }

    .lyrics-box h3 {
      margin-top: 0;
      color: #ff5477;
    }

    .lyrics-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .lyric-item {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 10px;
      border-radius: 8px;
      background: #1b1b23;
    }

    .lyric-time {
      padding: 4px 8px;
      background: #ff5477;
      color: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      white-space: nowrap;
    }

    .lyric-time:hover {
      background: #e04364;
    }

    .lyric-content {
      flex: 1;
    }

    .lyric-text {
      font-size: 15px;
      line-height: 1.5;
      color: #ffffff;
      font-weight: bold;
    }

    .lyric-roma {
      font-size: 13px;
      color: #ff8ba7;
      font-weight: normal;
    }

    .lyric-kor {
      font-size: 13px;
      color: #aaaaaa;
      font-weight: normal;
    }

    .lyric-cheer {
      font-size: 13px;
      color: #ffcf5a;
      margin-top: 4px;
      font-weight: bold;
    }

    footer {
      padding: 30px 20px;
      color: #777783;
      text-align: center;
      font-size: 12px;
    }
    /* 가사 박스 전체를 클릭 가능한 영역으로 표시 */
.lyric-item {
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
}

.lyric-item:hover {
  background: #30202a;
}

.lyric-item:focus-visible {
  outline: 2px solid #ff5477;
  outline-offset: 3px;
}

/* 마지막으로 클릭한 가사 표시 */
.lyric-item.selected {
  background: #30202a;
  box-shadow: inset 3px 0 0 #ff5477;
}
  </style>
</head>

<body>
  <header>
    <h1>美波 minami</h1>
    <h2>Timesick Traveler 2027</h2>
    <p>Unofficial Fan-made Cheering Guide</p>
  </header>

  <main>
    <section id="list">
      <h2 class="section-title">곡 목록</h2>
      <div id="song-list" class="song-list"></div>
    </section>

    <section id="detail">
      <button class="back-button" onclick="showList()">
        ← 곡 목록으로 돌아가기
      </button>

      <h2 id="song-title"></h2>

      <!-- 유튜브 동영상 플레이어 영역 -->
      <div class="video-wrapper">
        <div id="youtube-player"></div>
</div>


      <!-- 응원 및 감상 포인트 영역 -->
      <div class="guide-box">
        <h3>응원 및 감상 포인트</h3>
        <ul id="guide-points"></ul>
      </div>

      <!-- 타임라인 가사지 영역 -->
      <div class="lyrics-box">
        <h3>타임라인 가사지 & 응원 가이드</h3>
        <div id="lyrics-list" class="lyrics-list"></div>
      </div>
    </section>
  </main>

  <footer>
    본 사이트는 미나미 팬이 제작한 비공식 응원 가이드입니다.
  </footer>

  <script>
    const songs = [
      {
        title: "「비를 기다리다, (アメヲマツ、)」",
        youtubeId: "766qmHTc2ro", // 요청하신 영상 ID
        guidePoints: [
          "박수 구간 및 박자 확인",
          "라이브 특유의 템포 감상 포인트",
          "곡 전체 응원 타이밍 가이드 작성 예정"
        ],
        // 가사 데이터를 아래 형식처럼 추가하시면 됩니다.
        lyrics: [
          {
            time: "0:49",
            seconds: 49,
            text: `過去形フィルムに縋った僕らは<br>
                   <span class="lyric-roma">카코 케이휘루무니 스갓타 보쿠라와</span><br>
                   <span class="lyric-kor">과거형 필름에 매달린 우리들은</span>`,
            cheer: ""
          },
          {
            time: "0:54",
            seconds: 54,
            text: `舵取り粘土に飲まれていつしか固まっていくようで<br>
                   <span class="lyric-roma">카지토리 넨도니 노마레테 이츠시카 카타맛테 이쿠 요-데</span><br>
                   <span class="lyric-kor">키잡이 점토에 휘말려 어느새 굳어져 가는 거 같아서</span>`,
            cheer: ""
          },
          {
            time: "1:01",
            seconds: 61,
            text: `言葉税が 足りなくなっていってさ<br>
                   <span class="lyric-roma">코토바제이가 타리나쿠 낫테 잇테사</span><br>
                   <span class="lyric-kor">말솜씨가 부족해져서 말이야</span>`,
            cheer: ""
          },
          {
            time: "1:07",
            seconds: 67,
            text: `書きなぐり漁った下書きをそっと強く塗りつぶす<br>
                   <span class="lyric-roma">카키나구리아삿타 시타가키오 솟토 츠요쿠 누리 부스</span><br>
                   <span class="lyric-kor">휘갈겨 쓴 초본을 지긋이, 세게 칠했어</span>`,
            cheer: ""
          },
          {
            time: "1:15",
            seconds: 75,
            text: `平気だよきっと誰かが 透明人間あてにした<br>
                   <span class="lyric-roma">헤이키다요 킷토 다레카가 토-메이닌겐 아테니시타</span><br>
                   <span class="lyric-kor">괜찮아 분명 누군가가 투명인간 취급을 했어</span>`,
            cheer: ""
          },
          {
            time: "1:21",
            seconds: 81,
            text: `ああやっぱ今日もだめだな<br>
                   <span class="lyric-roma">아아 얏파 쿄오모 다메다나</span><br>
                   <span class="lyric-kor">아아 역시 오늘도 안되겠네</span>`,
            cheer: ""
          },
          {
            time: "1:23",
            seconds: 83,
            text: `ファインダー越しのかわききってた<br>
                   <span class="lyric-roma">화인-다 코시노 카와키 킷테타</span><br>
                   <span class="lyric-kor">파인더 너머의 말라 비틀어져가</span>`,
            cheer: ""
          },
          {
            time: "1:27",
            seconds: 87,
            text: `僕にアメ降らせてくれないか<br>
                   <span class="lyric-roma">보쿠니 아메 후라세테 쿠레나이카</span><br>
                   <span class="lyric-kor">나에게 비를 내려주지 않을려나</span>`,
            cheer: ""
          },
          {
            time: "1:30",
            seconds: 90,
            text: `何度塗り替えても 濁ってしまって<br>
                   <span class="lyric-roma">난도 누리카에테모 니곳테 시맛테</span><br>
                   <span class="lyric-kor">몇 번이고 다시 칠해도 흐려져서</span>`,
            cheer: ""
          },
          {
            time: "1:33",
            seconds: 93,
            text: `今はもう届かなくなったリリック<br>
                   <span class="lyric-roma">이마와 모오 토도카나쿠 낫타 리릭쿠</span><br>
                   <span class="lyric-kor">지금은 더이상 닿지 않게 된 가사</span>`,
            cheer: ""
          }
        ]
      }
    ];

const songList = document.getElementById("song-list");
const listSection = document.getElementById("list");
const detailSection = document.getElementById("detail");
const songTitle = document.getElementById("song-title");
const guidePoints = document.getElementById("guide-points");
const lyricsList = document.getElementById("lyrics-list");

let player = null;
let playerReady = false;
let currentSong = null;
let pendingSeek = null;

// 유튜브 API 준비 완료를 기다리기 위한 Promise
const youtubeApiReady = new Promise((resolve) => {
  if (window.YT && window.YT.Player) {
    resolve();
    return;
  }

  window.onYouTubeIframeAPIReady = resolve;

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(script);
});

// 곡 목록 만들기
songs.forEach((song, index) => {
  const button = document.createElement("button");

  button.className = "song-button";
  button.innerHTML = `
    <span class="song-number">
      ${String(index + 1).padStart(2, "0")}
    </span>
    ${song.title}
  `;

  button.addEventListener("click", () => {
    showDetail(song);
  });

  songList.appendChild(button);
});

// 곡 상세 화면 열기
async function showDetail(song) {
  currentSong = song;
  pendingSeek = null;

  listSection.style.display = "none";
  detailSection.style.display = "block";

  songTitle.textContent = song.title;

  // 응원 포인트 출력
  guidePoints.innerHTML = "";

  song.guidePoints.forEach((point) => {
    const li = document.createElement("li");
    li.textContent = point;
    guidePoints.appendChild(li);
  });

  // 가사 출력
  lyricsList.innerHTML = "";

  if (song.lyrics && song.lyrics.length > 0) {
    song.lyrics.forEach((item) => {
      const lyricDiv = document.createElement("div");

      lyricDiv.className = "lyric-item";
      lyricDiv.tabIndex = 0;
      lyricDiv.setAttribute("role", "button");
      lyricDiv.setAttribute(
        "aria-label",
        `${item.time} 가사 구간으로 이동`
      );

      // 시간은 별도 버튼이 아니라 박스 안의 표시로 사용
      lyricDiv.innerHTML = `
        <span class="lyric-time">${item.time}</span>

        <div class="lyric-content">
          <div class="lyric-text">${item.text}</div>
          ${
            item.cheer
              ? `<div class="lyric-cheer">${item.cheer}</div>`
              : ""
          }
        </div>
      `;

      function activateLyric() {
        lyricsList
          .querySelectorAll(".lyric-item.selected")
          .forEach((element) => {
            element.classList.remove("selected");
          });

        lyricDiv.classList.add("selected");
        seekTo(item.seconds);
      }

      // 시간, 일본어 가사, 발음, 번역, 빈 공간 모두 클릭 가능
      lyricDiv.addEventListener("click", activateLyric);

      // 키보드에서도 Enter 또는 Space로 이동 가능
      lyricDiv.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activateLyric();
        }
      });

      lyricsList.appendChild(lyricDiv);
    });
  } else {
    lyricsList.innerHTML =
      "<p style='color: #888;'>가사 준비 중입니다.</p>";
  }

  window.scrollTo(0, 0);

  // API가 준비될 때까지 기다림
  await youtubeApiReady;

  // 기다리는 사이 목록으로 돌아갔거나 다른 곡을 선택했다면 중단
  if (currentSong !== song) return;

  if (!player) {
    player = new YT.Player("youtube-player", {
      host: "https://www.youtube-nocookie.com",
      videoId: song.youtubeId,

      playerVars: {
        playsinline: 1,
        rel: 0
      },

      events: {
        onReady: (event) => {
          playerReady = true;

          if (!currentSong) return;

          // 준비되는 사이 선택 곡이 바뀌었을 경우 반영
          if (currentSong !== song) {
            event.target.cueVideoById(currentSong.youtubeId);
          }

          // 준비 전에 가사를 눌렀다면 해당 시간으로 이동
          if (pendingSeek !== null) {
            const seconds = pendingSeek;
            pendingSeek = null;
            seekTo(seconds);
          }
        }
      }
    });
  } else if (playerReady) {
    player.cueVideoById(song.youtubeId);

    if (pendingSeek !== null) {
      const seconds = pendingSeek;
      pendingSeek = null;
      seekTo(seconds);
    }
  }
}

// 플레이어를 새로 불러오지 않고 재생 위치만 변경
function seekTo(seconds) {
  if (!player || !playerReady) {
    pendingSeek = seconds;
    return;
  }

  player.seekTo(seconds, true);
  player.playVideo();
}

// 곡 목록으로 돌아가기
function showList() {
  currentSong = null;
  pendingSeek = null;

  if (player && playerReady) {
    player.pauseVideo();
  }

  detailSection.style.display = "none";
  listSection.style.display = "block";

  window.scrollTo(0, 0);
}
  </script>
</body>
</html>
