<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>minami Timesick Traveler 2027 Fan Guide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101014;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 55px 20px 40px;
      text-align: center;
      background: linear-gradient(135deg, #190b16, #35111d);
    }

    header h1 {
      margin: 0 0 12px;
      color: #ff5477;
      font-size: 32px;
    }

    header h2 {
      margin: 0;
      color: #eeeeee;
      font-size: 20px;
      font-weight: normal;
    }

    header p {
      margin: 20px 0 0;
      color: #bbbbbb;
      font-size: 14px;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 35px auto;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 22px;
    }

    .song-list {
      display: grid;
      gap: 12px;
    }

    .song-button {
      width: 100%;
      padding: 18px 20px;
      border: 1px solid #3a3a45;
      border-radius: 14px;
      background: #1b1b23;
      color: #ffffff;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .song-button:hover {
      background: #30202a;
      border-color: #ff5477;
      transform: translateY(-2px);
    }

    .song-number {
      display: inline-block;
      width: 32px;
      color: #ff5477;
      font-weight: bold;
    }

    #detail {
      display: none;
    }

    .back-button {
      margin-bottom: 20px;
      padding: 10px 16px;
      border: 1px solid #555563;
      border-radius: 8px;
      background: transparent;
      color: #ffffff;
      cursor: pointer;
    }

    .back-button:hover {
      background: #292932;
    }

    #song-title {
      margin-bottom: 20px;
      color: #ff5477;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 14px;
      background: #000000;
    }

    .video-wrapper iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      left: 0;
      top: 0;
    }

    .guide-box {
      margin-top: 24px;
      padding: 22px;
      border-radius: 14px;
      background: #1b1b23;
    }

    .guide-box h3 {
      margin-top: 0;
      color: #ffcf5a;
    }

    .guide-box li {
      margin-bottom: 12px;
      line-height: 1.6;
      color: #dddddd;
    }

    footer {
      padding: 30px 20px;
      color: #777783;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>美波 minami</h1>
    <h2>Timesick Traveler 2027</h2>
    <p>Unofficial Fan-made Cheering Guide</p>
  </header>

  <main>
    <section id="list">
      <h2 class="section-title">곡 목록</h2>
      <div id="song-list" class="song-list"></div>
    </section>

    <section id="detail">
      <button class="back-button" onclick="showList()">
        ← 곡 목록으로 돌아가기
      </button>

      <h2 id="song-title"></h2>

      <div class="video-wrapper">
        <iframe
          id="youtube-player"
          src=""
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div class="guide-box">
        <h3>응원 및 감상 포인트</h3>
        <ul id="guide-points"></ul>
      </div>
    </section>
  </main>

  <footer>
    본 사이트는 미나미 팬이 제작한 비공식 응원 가이드입니다.
  </footer>

  <script>
    const songs = [
      {
        title: "테스트 곡 1",
        youtubeId: "dQw4w9WgXcQ",
        guidePoints: [
          "이곳에 함께 부를 구간을 적을 예정입니다.",
          "이곳에 박수나 손동작 타이밍을 적을 예정입니다.",
          "이곳에 감상 포인트를 적을 예정입니다."
        ]
      },
      {
        title: "테스트 곡 2",
        youtubeId: "dQw4w9WgXcQ",
        guidePoints: [
          "나중에 실제 응원 포인트로 바꿔주세요."
        ]
      },
      {
        title: "테스트 곡 3",
        youtubeId: "dQw4w9WgXcQ",
        guidePoints: [
          "곡 정보를 준비한 뒤 이 부분을 수정하면 됩니다."
        ]
      }
    ];

    const songList = document.getElementById("song-list");
    const listSection = document.getElementById("list");
    const detailSection = document.getElementById("detail");
    const songTitle = document.getElementById("song-title");
    const youtubePlayer = document.getElementById("youtube-player");
    const guidePoints = document.getElementById("guide-points");

    songs.forEach((song, index) => {
      const button = document.createElement("button");

      button.className = "song-button";
      button.innerHTML = `
        <span class="song-number">${String(index + 1).padStart(2, "0")}</span>
        ${song.title}
      `;

      button.addEventListener("click", () => {
        showDetail(song);
      });

      songList.appendChild(button);
    });

    function showDetail(song) {
      listSection.style.display = "none";
      detailSection.style.display = "block";

      songTitle.textContent = song.title;
      youtubePlayer.src =
        `https://www.youtube.com/embed/${song.youtubeId}`;

      guidePoints.innerHTML = "";

      song.guidePoints.forEach((point) => {
        const li = document.createElement("li");
        li.textContent = point;
        guidePoints.appendChild(li);
      });

      window.scrollTo(0, 0);
    }

    function showList() {
      detailSection.style.display = "none";
      listSection.style.display = "block";

      youtubePlayer.src = "";
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
